services:
  subdue:
    # Builds this checkout. To run the released image instead, swap this for
    # `image: ghcr.io/lovelesscodes/subdue:latest`.
    build: .
    ports:
      - '3000:3000'
    environment:
      # All optional: the secret is generated into the volume on first boot,
      # the base URL is derived per request, and origins default to any.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
